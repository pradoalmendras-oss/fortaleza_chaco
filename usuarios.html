<form id="formUsuario" class="card card-body mb-4 shadow-sm">
  <!-- Campo oculto para saber si estamos editando o creando un nuevo registro -->
  <input type="hidden" id="txtIdUsuario" value="" />

  <div class="row">
    <div class="col-md-4 mb-3">
      <label for="txtNombre" class="form-label">Nombre</label>
      <input type="text" id="txtNombre" class="form-control" placeholder="Nombre Completo" required />
    </div>

    <div class="col-md-4 mb-3">
      <label for="txtApellido1" class="form-label">Primer Apellido</label>
      <input type="text" id="txtApellido1" class="form-control" placeholder="Primer Apellido" required />
    </div>

    <div class="col-md-4 mb-3">
      <label for="txtApellido2" class="form-label">Segundo Apellido</label>
      <input type="text" id="txtApellido2" class="form-control" placeholder="Segundo Apellido" />
    </div>
  </div>

  <div class="row">
    <div class="col-md-4 mb-3">
      <label for="txtCelular" class="form-label">Celular</label>
      <input type="text" id="txtCelular" class="form-control" placeholder="Celular" />
    </div>

    <!-- Campo Contraseña con Botón para Generar integrados -->
    <div class="col-md-5 mb-3">
      <label for="txtPassword" class="form-label">Contraseña</label>
      <div class="input-group">
        <input type="text" id="txtPassword" class="form-control" placeholder="Escribe o genera una clave" required />
        <button class="btn btn-outline-secondary" type="button" id="btnGenerarPass">
          🎲 Generar
        </button>
      </div>
      <small class="form-text text-muted">Puedes ingresar una manualmente o hacer clic en "Generar".</small>
    </div>

    <div class="col-md-3 mb-3">
      <label for="selectRol" class="form-label">Rol</label>
      <select id="selectRol" class="form-select" required>
        <option value="Administrador">Administrador</option>
        <option value="Operador">Operador</option>
      </select>
    </div>
  </div>

  <div>
    <button type="submit" id="btnGuardar" class="btn btn-primary">Guardar Usuario</button>
  </div>
</form>

<!-- Tabla Inferior -->
<table class="table table-striped table-hover align-middle mt-4">
  <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Nombre Completo</th>
      <th>Celular</th>
      <th>Rol</th>
      <th>Estado</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody id="tbodyUsuarios">
    <!-- El código JavaScript insertará aquí las filas y los botones -->
  </tbody>
</table>

<!-- Carga del Script al final -->
<script src="../renderer/usuarios.js"></script>
